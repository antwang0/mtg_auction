<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scheduled Matches</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>🎲 Matches</h1>
    <div id="status" class="status muted"></div>
    <div class="auth">
      <a class="navlink" href="/">← Game</a>
    </div>
  </header>

  <main>
    <div class="columns">
      <section class="card">
        <h2>Upcoming <span class="muted">— times shown in your local timezone</span></h2>
        <div id="m-upcoming"></div>
      </section>

      <section class="card">
        <h2>Results</h2>
        <div id="m-results"></div>

        <h2>Standings</h2>
        <table id="m-standings" class="grid">
          <thead><tr><th>#</th><th>Player</th><th class="num">ELO</th><th class="num">W-L-D</th></tr></thead>
          <tbody></tbody>
        </table>
      </section>
    </div>
  </main>

  <script src="/util.js"></script>
  <script src="/matches.js"></script>
</body>
</html>
