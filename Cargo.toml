[package]
name = "mtg_auction"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls"] }
getrandom = "0.4.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tower-http = { version = "0.7.0", features = ["compression-gzip", "trace"] }

[dev-dependencies]
proptest = "1.11"

[profile.release]
opt-level = 3
